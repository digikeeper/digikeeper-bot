services:
  digikeeper-bot:
    image: ghcr.io/gitrus/digikeeper-bot:main
    container_name: digikeeper-bot
    environment:
      - LOCAL_PORT=8081
      - LOCAL_HOST=0.0.0.0
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_token
      - TELEGRAM_BOT_PUBLIC_URL=${TELEGRAM_BOT_PUBLIC_URL:-localhost}
      - TELEGRAM_ALLOWED_UPDATES=message
      - SQLITE_PATH=/data/sessions.db
      - SESSION_EXPIRES_AFTER=24h
    ports:
      - target: 8081
        published: 8081
      - target: 8091
        published: 8091
    volumes:
      - sessions_data:/data
    restart: unless-stopped
    secrets:
      - telegram_token
    mem_limit: 512M
    mem_reservation: 256M
    cpus: 0.5

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  sessions_data:
    driver: local

secrets:
  telegram_token:
    file: ./secrets/telegram_token
